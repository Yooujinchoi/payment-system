<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오셨드레요 메밀여행 - 카운터 결제 POS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #34495e; color: #333; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; color: #fff; margin-bottom: 20px; }
        h1 { font-size: 24px; }

        .payment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .payment-card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: space-between; min-height: 240px; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .table-badge { background: #2c3e50; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .time-text { font-size: 13px; color: #7f8c8d; }

        .item-list { margin-bottom: 15px; max-height: 180px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; margin-bottom: 6px; padding: 4px 0; border-bottom: 1px dashed #f0f0f0; }
        .item-name { font-weight: bold; color: #2c3e50; }
        .item-price-info { text-align: right; font-size: 14px; }
        .item-price { color: #e67e22; font-weight: bold; }

        .card-footer { border-top: 2px solid #eee; padding-top: 10px; margin-top: auto; }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 18px; font-weight: bold; }
        .total-price { color: #e74c3c; font-size: 20px; }

        .btn-pay { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-pay:hover { background: #219150; }
    </style>

    <!-- Firebase SDK 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 사용자님의 실제 Firebase 설정 적용 완료
        const firebaseConfig = {
            apiKey: "AIzaSyAceyCFUzGg5fz5pPWt9H6RgE3wrQe0ob4",
            authDomain: "memil-pos.firebaseapp.com",
            projectId: "memil-pos",
            storageBucket: "memil-pos.firebasestorage.app",
            messagingSenderId: "935304612479",
            appId: "1:935304612479:web:7da29c1b9d53bce4da8d4a",
            measurementId: "G-HT56JW59BN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const q = query(collection(db, "orders"), orderBy("timestamp", "asc"));
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('payment-container');
            container.innerHTML = '';
            let unpaidCount = 0;

            snapshot.docs.forEach(docSnap => {
                const order = docSnap.data();
                const docId = docSnap.id;

                if (!order.paid && order.total > 0) {
                    unpaidCount++;
                    const card = document.createElement('div');
                    card.className = 'payment-card';

                    let itemsHtml = '';
                    order.items.forEach(item => {
                        itemsHtml += `
                            <div class="item-row">
                                <span class="item-name">${item.name}</span>
                                <span class="item-price-info">
                                    <span>${item.qty}개</span>
                                    <span class="item-price">(${item.price ? item.price.toLocaleString() : 0}원)</span>
                                </span>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span class="table-badge">${order.table}</span>
                                <span class="time-text">${order.time}</span>
                            </div>
                            <div class="item-list">${itemsHtml}</div>
                        </div>
                        <div class="card-footer">
                            <div class="total-row">
                                <span>총 결제금액</span>
                                <span class="total-price">${order.total.toLocaleString()}원</span>
                            </div>
                            <button class="btn-pay" onclick="completePayment('${docId}')">💳 결제 완료</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });

            if (unpaidCount === 0) {
                container.innerHTML = '<div style="color:#fff; text-align:center; grid-column: 1/-1; padding: 50px 0; font-size: 18px;">현재 결제 대기 중인 테이블이 없습니다.</div>';
            }
        });

        window.completePayment = async function(docId) {
            if (confirm("결제 완료 처리하시겠습니까?")) {
                const docRef = doc(db, "orders", docId);
                await updateDoc(docRef, { paid: true });
            }
        };
    </script>
</head>
<body>
    <header>
        <h1>💳 오셨드레요 메밀여행 - 카운터 결제 POS</h1>
    </header>
    <div class="payment-grid" id="payment-container"></div>
</body>
</html>
