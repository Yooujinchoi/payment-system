<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 결제 시스템 - 오셨드레요 메밀여행</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f4f6f7; color: #333; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #34495e; color: #fff; padding: 15px 20px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 22px; }
        
        .btn-sales { padding: 10px 16px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-sales:hover { background-color: #219653; }

        .payment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .pay-card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 4px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; border-left: 6px solid #e74c3c; }
        .pay-card.paid { border-left-color: #2ecc71; opacity: 0.6; }
        
        .card-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; margin-bottom: 12px; }
        .table-name { font-size: 18px; font-weight: bold; color: #d32f2f; }
        .order-time { font-size: 13px; color: #7f8c8d; }

        .item-list { margin-bottom: 15px; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 15px; }
        
        .total-box { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 2px solid #34495e; font-size: 18px; font-weight: bold; color: #2c3e50; }
        .btn-pay { width: 100%; padding: 12px; background: #e74c3c; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .btn-pay.completed { background: #7f8c8d; cursor: not-allowed; }

        /* 매출표 팝업창(모달) 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; width: 90%; max-width: 800px; max-height: 85vh; border-radius: 12px; padding: 25px; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; font-weight: bold; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #000; }
        
        .filter-box { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0; flex-wrap: wrap; gap: 10px; }
        .filter-left { display: flex; gap: 10px; align-items: center; }
        .filter-box input[type="month"] { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        
        .btn-reset { padding: 8px 14px; background-color: #e74c3c; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-reset:hover { background-color: #c0392b; }

        .summary-card { background: #ebf5fb; border: 1px solid #aed6f1; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f4f6f7; }
    </style>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDocs, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAceyCFUzGg5fz5pPWt9H6RgE3wrQe0ob4",
            authDomain: "memil-pos.firebaseapp.com",
            projectId: "memil-pos",
            storageBucket: "memil-pos.firebasestorage.app",
            messagingSenderId: "935304612479",
            appId: "1:935304612479:web:7da29c1b9d53bce4da8d4a",
            measurementId: "G-HT56JW59BN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.onSnapshot = onSnapshot;
        window.doc = doc;
        window.updateDoc = updateDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;
        window.deleteDoc = deleteDoc;
    </script>
</head>
<body>

    <header>
        <h1>💳 카운터 결제 관리</h1>
        <button class="btn-sales" onclick="openSalesModal()">📊 월간 매출표 바로보기</button>
    </header>

    <div class="payment-grid" id="payment-container">
        <!-- 주문 결제 대기 내역 들어오는 곳 -->
    </div>

    <!-- 매출표 팝업창 (모달) -->
    <div class="modal-overlay" id="sales-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeSalesModal()">&times;</span>
            <h2>📊 월간 결제 내역 (매출표)</h2>

            <div class="filter-box">
                <div class="filter-left">
                    <label for="month-select"><b>조회 월 선택:</b></label>
                    <input type="month" id="month-select" onchange="loadSalesData()">
                </div>
                <button class="btn-reset" onclick="resetSalesData()">🗑️ 매출표 초기화</button>
            </div>

            <div class="summary-card">
                <span id="summary-month-text" style="font-weight:bold; color:#2e86c1;">선택 월 총 매출</span>
                <span id="total-monthly-sales" style="font-size:22px; font-weight:bold; color:#1b4f72;">0 원</span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">결제 일시</th>
                        <th style="width: 20%;">위치</th>
                        <th>주문 내역</th>
                        <th style="text-align:right; width: 20%;">금액</th>
                    </tr>
                </thead>
                <tbody id="sales-table-body">
                    <tr><td colspan="4" style="text-align:center;">조회 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = function() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('month-select').value = `${y}-${m}`;

            // 실시간 결제 현황 모니터링
            window.onSnapshot(window.collection(window.db, "orders"), (snapshot) => {
                const container = document.getElementById('payment-container');
                container.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const orderId = docSnap.id;

                    // 미결제 건만 상단에 노출
                    if (!data.paid) {
                        const card = document.createElement('div');
                        card.className = 'pay-card';

                        let itemsHtml = '';
                        if(data.items) {
                            data.items.forEach(i => {
                                itemsHtml += `<div class="item-row"><span>${i.name} (${i.qty}개)</span><span>${(i.price || 0).toLocaleString()}원</span></div>`;
                            });
                        }

                        card.innerHTML = `
                            <div>
                                <div class="card-head">
                                    <span class="table-name">${data.table}</span>
                                    <span class="order-time">${data.time}</span>
                                </div>
                                <div class="item-list">${itemsHtml}</div>
                            </div>
                            <div>
                                <div class="total-box">
                                    <span>총 결제 금액</span>
                                    <span style="color:#d32f2f;">${(data.total || 0).toLocaleString()}원</span>
                                </div>
                                <button class="btn-pay" onclick="markAsPaid('${orderId}')">💳 결제 완료 처리</button>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });
            });
        };

        // 결제 완료 처리
        async function markAsPaid(orderId) {
            if(confirm("결제를 완료 처리하시겠습니까?")) {
                await window.updateDoc(window.doc(window.db, "orders", orderId), {
                    paid: true
                });
            }
        }

        // 매출표 팝업 열기
        function openSalesModal() {
            document.getElementById('sales-modal').style.display = 'flex';
            loadSalesData();
        }

        // 매출표 팝업 닫기
        function closeSalesModal() {
            document.getElementById('sales-modal').style.display = 'none';
        }

        // 매출 데이터 조회
        async function loadSalesData() {
            const selectedMonth = document.getElementById('month-select').value;
            if (!selectedMonth) return;

            document.getElementById('summary-month-text').innerText = `${selectedMonth} 총 매출액`;
            const tbody = document.getElementById('sales-table-body');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">불러오는 중...</td></tr>';

            try {
                const q = window.query(window.collection(window.db, "orders"), window.orderBy("timestamp", "desc"));
                const querySnapshot = await window.getDocs(q);

                let monthlyTotal = 0;
                let html = '';
                let count = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.paid) {
                        const orderDate = new Date(data.timestamp);
                        const orderYearMonth = `${orderDate.getFullYear()}-${String(orderDate.getMonth() + 1).padStart(2, '0')}`;

                        if (orderYearMonth === selectedMonth) {
                            count++;
                            monthlyTotal += (data.total || 0);
                            const dateStr = `${orderDate.getMonth() + 1}/${orderDate.getDate()} ${data.time || ''}`;
                            
                            let itemsText = data.items ? data.items.map(i => `${i.name}(${i.qty})`).join(', ') : '-';

                            html += `
                                <tr>
                                    <td>${dateStr}</td>
                                    <td><b>${data.table}</b></td>
                                    <td style="font-size:12px; color:#555;">${itemsText}</td>
                                    <td style="text-align:right; font-weight:bold; color:#d32f2f;">${(data.total || 0).toLocaleString()}원</td>
                                </tr>
                            `;
                        }
                    }
                });

                if (count === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999; padding:20px;">결제 완료 내역이 없습니다.</td></tr>';
                } else {
                    tbody.innerHTML = html;
                }

                document.getElementById('total-monthly-sales').innerText = monthlyTotal.toLocaleString() + " 원";

            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">오류가 발생했습니다.</td></tr>';
            }
        }

        // 매출표 초기화 (비밀번호 확인 포함)
        async function resetSalesData() {
            const selectedMonth = document.getElementById('month-select').value;
            if (!selectedMonth) return;

            const pw = prompt("매출표를 초기화하려면 비밀번호를 입력하세요:");
            if (pw === null) return; // 취소 누른 경우

            if (pw !== "0146") {
                alert("비밀번호가 올바르지 않습니다.");
                return;
            }

            if (confirm(`${selectedMonth} 매출 내역을 정말 전부 삭제하시겠습니까? 삭제된 내역은 복구할 수 없습니다.`)) {
                try {
                    const q = window.query(window.collection(window.db, "orders"));
                    const querySnapshot = await window.getDocs(q);

                    let deleteCount = 0;
                    const deletePromises = [];

                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.paid && data.timestamp) {
                            const orderDate = new Date(data.timestamp);
                            const orderYearMonth = `${orderDate.getFullYear()}-${String(orderDate.getMonth() + 1).padStart(2, '0')}`;

                            // 선택한 월의 결제 완료 건 삭제
                            if (orderYearMonth === selectedMonth) {
                                deletePromises.push(window.deleteDoc(window.doc(window.db, "orders", docSnap.id)));
                                deleteCount++;
                            }
                        }
                    });

                    await Promise.all(deletePromises);
                    alert(`${deleteCount}건의 매출 내역이 정상적으로 삭제되었습니다.`);
                    loadSalesData(); // 테이블 새로고침

                } catch (e) {
                    console.error(e);
                    alert("초기화 중 오류가 발생했습니다.");
                }
            }
        }
    </script>
</body>
</html>
