<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카운터 테이블 주문 및 자리 이동 관리 (Payment)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #1e293b; color: #f8fafc; padding: 15px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* 상단 헤더 */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #334155; margin-bottom: 15px; }
        h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .header-btns { display: flex; gap: 8px; }
        .mode-btn { background-color: #f97316; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .sales-btn { background-color: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .reset-btn { background-color: #dc2626; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

        /* 메인 레이아웃 (좌측 테이블, 우측 메뉴패널) */
        .main-container { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        .tables-section { flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-right: 5px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; color: #e2e8f0; }
        .tables-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

        /* 테이블 카드 */
        .table-card { background: #ffffff; color: #1e293b; border-radius: 8px; padding: 12px; min-height: 140px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; position: relative; }
        .table-card.selected { border-color: #eab308; box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.4); }
        .table-card.active { background: #f0fdf4; }
        .table-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .order-time { font-size: 11px; color: #64748b; font-weight: normal; }

        .order-items { font-size: 12px; color: #475569; flex: 1; overflow-y: auto; line-height: 1.4; margin-bottom: 6px; }
        .table-footer { text-align: right; font-weight: bold; color: #dc2626; font-size: 14px; border-top: 1px dashed #cbd5e1; padding-top: 4px; }
        .empty-text { color: #94a3b8; font-size: 12px; text-align: center; margin-top: 30px; }

        /* 우측 직접 추가 패널 */
        .side-panel { width: 280px; background: #0f172a; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; border: 1px solid #334155; }
        .panel-title { text-align: center; font-weight: bold; margin-bottom: 10px; color: #f59e0b; font-size: 15px; }
        .target-table-info { font-size: 13px; color: #38bdf8; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .menu-btn-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
        .menu-btn { background: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; transition: background 0.2s; }
        .menu-btn:hover { background: #e2e8f0; }

        .btn-clear-table { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; width: 100%; }

        .divider { border-bottom: 1px dashed #334155; margin: 10px 0; }

        /* 매출 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #ffffff; color: #1e293b; padding: 20px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-close { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .sales-summary { background: #f1f5f9; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
        .sales-summary div { margin-bottom: 4px; font-size: 14px; }
        .sales-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .sales-table th, .sales-table td { border: 1px solid #cbd5e1; padding: 8px; text-align: center; }
        .sales-table th { background: #f8fafc; font-weight: bold; }
    </style>

    <!-- Firebase SDK 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAceyCFUzGg5fz5pPWt9H6RgE3wrQe0ob4",
            authDomain: "memil-pos.firebaseapp.com",
            projectId: "memil-pos",
            storageBucket: "memil-pos.firebasestorage.app",
            messagingSenderId: "935304612479",
            appId: "1:935304612479:web:7da29c1b9d53bce4da8d4a",
            measurementId: "G-HT56JW59BN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.getDocs = getDocs;

        let isInitialLoad = true;

        // 테이블 주문 데이터 실시간 수신
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const activeOrders = {};

            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const data = change.doc.data();
                    if (!isInitialLoad && !data.isManualOrder) {
                        playOrderAudio();
                    }
                }
            });

            snapshot.forEach((doc) => {
                const data = doc.data();
                data.id = doc.id;

                if (!activeOrders[data.table]) {
                    activeOrders[data.table] = [];
                }
                activeOrders[data.table].push(data);
            });

            window.currentOrders = activeOrders;
            if (window.renderTables) window.renderTables();
            isInitialLoad = false;
        });

        // 매출 전용 데이터 실시간 수신
        onSnapshot(collection(db, "sales"), (snapshot) => {
            window.salesHistory = [];
            snapshot.forEach((doc) => {
                window.salesHistory.push(doc.data());
            });
        });
    </script>
</head>
<body>

    <header>
        <h1>🖥️ 카운터 테이블 주문 및 자리 이동 관리</h1>
        <div class="header-btns">
            <button class="sales-btn" onclick="openSalesModal()">📊 월간 매출표</button>
            <button class="mode-btn" id="move-mode-btn" onclick="toggleMoveMode()">🔄 자리 이동 모드: OFF</button>
            <button class="reset-btn" onclick="resetSalesData()">🧹 매출표 초기화</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 좌측 테이블 목록 -->
        <div class="tables-section">
            <div class="section-title">🏠 매장 테이블</div>
            <div class="tables-grid" id="indoor-grid"></div>

            <div class="divider"></div>

            <div class="section-title">🌿 테라스 테이블</div>
            <div class="tables-grid" id="terrace-grid"></div>
        </div>

        <!-- 우측 메뉴 직접 추가 패널 -->
        <div class="side-panel">
            <div class="panel-title">➕ 메뉴 직접 추가</div>
            <div class="target-table-info" id="target-info">현재 선택: 1번 테이블</div>

            <div class="menu-btn-list" id="menu-btn-container"></div>

            <button class="btn-clear-table" onclick="clearSelectedTable()">🧹 테이블 비우기(결제/퇴장)</button>
        </div>
    </div>

    <!-- 월간 매출 모달 창 -->
    <div class="modal" id="sales-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="sales-title">📊 당월 매출 집계표</h2>
                <button class="modal-close" onclick="closeSalesModal()">닫기</button>
            </div>
            <div class="sales-summary">
                <div><strong>총 매출액:</strong> <span id="total-sales-amount" style="color:#c0392b; font-size:16px;">0</span>원</div>
                <div><strong>총 결제 건수:</strong> <span id="total-order-count">0</span>건</div>
            </div>
            <table class="sales-table">
                <thead>
                    <tr>
                        <th>메뉴명</th>
                        <th>판매 수량</th>
                        <th>합계 금액</th>
                    </tr>
                </thead>
                <tbody id="sales-table-body">
                    <tr><td colspan="3">매출 내역이 없습니다.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const indoorTables = ["1번 테이블", "2번 테이블", "3번 테이블", "4번 테이블", "5번 테이블", "6번 테이블", "7번 테이블", "8번 테이블"];
        const terraceTables = ["테라스 1번", "테라스 2번", "테라스 3번", "테라스 4번"];

        const allMenus = [
            { name: "메밀전모듬", price: 20000, kitchen: 1 },
            { name: "메밀전", price: 7000, kitchen: 1 },
            { name: "메밀전병", price: 7000, kitchen: 1 },
            { name: "수수부꾸미(수수전병)", price: 7000, kitchen: 1 },
            { name: "감자전", price: 10000, kitchen: 1 },
            { name: "메밀물막국수", price: 9000, kitchen: 2 },
            { name: "메밀비빔막국수", price: 9000, kitchen: 2 },
            { name: "메밀들기름막국수", price: 10000, kitchen: 2 },
            { name: "메밀묵사발", price: 9000, kitchen: 2 },
            { name: "감자옹심이", price: 10000, kitchen: 2 },
            { name: "소주 / 맥주", price: 5000, kitchen: 1 },
            { name: "봉평메밀막걸리", price: 5000, kitchen: 1 },
            { name: "음료수", price: 2000, kitchen: 1 },
            { name: "사리추가", price: 3000, kitchen: 2 }
        ];

        let selectedTable = "1번 테이블";
        let isMoveMode = false;
        let moveSourceTable = null;

        function playOrderAudio() {
            try {
                const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/clack.ogg");
                audio.play().catch(e => console.log("오디오 재생 제한:", e));
            } catch (e) {
                console.error(e);
            }
        }

        function toggleMoveMode() {
            isMoveMode = !isMoveMode;
            moveSourceTable = null;
            const btn = document.getElementById('move-mode-btn');
            btn.innerText = `🔄 자리 이동 모드: ${isMoveMode ? 'ON' : 'OFF'}`;
            btn.style.backgroundColor = isMoveMode ? '#22c55e' : '#f97316';
            window.renderTables();
        }

        function selectTable(tableName) {
            if (isMoveMode) {
                if (!moveSourceTable) {
                    moveSourceTable = tableName;
                    alert(`${tableName}을(를) 어디로 이동할지 대상 테이블을 클릭하세요.`);
                } else {
                    if (moveSourceTable !== tableName) {
                        moveTableOrders(moveSourceTable, tableName);
                    }
                    moveSourceTable = null;
                    toggleMoveMode();
                }
            } else {
                selectedTable = tableName;
                document.getElementById('target-info').innerText = `현재 선택: ${selectedTable}`;
            }
            window.renderTables();
        }

        async function moveTableOrders(fromTable, toTable) {
            const orders = (window.currentOrders && window.currentOrders[fromTable]) || [];
            if (orders.length === 0) {
                alert(`${fromTable}에 이동할 주문 내역이 없습니다.`);
                return;
            }

            if (!confirm(`${fromTable}의 주문을 ${toTable}(으)로 이동하시겠습니까?`)) return;

            try {
                for (const ord of orders) {
                    const newOrd = { ...ord, table: toTable };
                    delete newOrd.id;
                    await window.addDoc(window.collection(window.db, "orders"), newOrd);
                    await window.deleteDoc(window.doc(window.db, "orders", ord.id));
                }
                alert("자리가 정상적으로 이동되었습니다.");
            } catch (e) {
                alert("이동 중 오류 발생: " + e.message);
            }
        }

        window.renderTables = function() {
            const indoorGrid = document.getElementById('indoor-grid');
            const terraceGrid = document.getElementById('terrace-grid');
            indoorGrid.innerHTML = '';
            terraceGrid.innerHTML = '';

            indoorTables.forEach(t => indoorGrid.appendChild(createTableCard(t)));
            terraceTables.forEach(t => terraceGrid.appendChild(createTableCard(t)));
        };

        function createTableCard(tableName) {
            const orders = (window.currentOrders && window.currentOrders[tableName]) || [];
            const card = document.createElement('div');
            
            let isSelected = (selectedTable === tableName);
            if (isMoveMode && moveSourceTable === tableName) isSelected = true;

            card.className = `table-card ${orders.length > 0 ? 'active' : ''} ${isSelected ? 'selected' : ''}`;
            card.onclick = () => selectTable(tableName);

            let totalAmount = 0;
            let itemsHtml = '';
            let latestTime = '';

            orders.forEach(ord => {
                latestTime = ord.time;
                ord.items.forEach(item => {
                    totalAmount += item.price;
                    itemsHtml += `<div>${item.name} x${item.qty}</div>`;
                });
            });

            card.innerHTML = `
                <div>
                    <div class="table-header">
                        <span>${tableName}</span>
                        <span class="order-time">${latestTime}</span>
                    </div>
                    <div class="order-items">
                        ${itemsHtml || '<div class="empty-text">빈 테이블</div>'}
                    </div>
                </div>
                ${totalAmount > 0 ? `<div class="table-footer">${totalAmount.toLocaleString()}원</div>` : ''}
            `;
            return card;
        }

        function renderMenuButtons() {
            const container = document.getElementById('menu-btn-container');
            container.innerHTML = '';

            allMenus.forEach(menu => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = menu.name;
                btn.onclick = () => addMenuToSelectedTable(menu);
                container.appendChild(btn);
            });
        }

        async function addMenuToSelectedTable(menu) {
            if (!selectedTable) {
                alert("테이블을 선택해주세요.");
                return;
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

            const itemData = { name: menu.name, qty: 1, price: menu.price };

            const manualOrder = {
                timestamp: Date.now(),
                table: selectedTable,
                time: timeStr,
                items: [itemData],
                kitchen1: menu.kitchen === 1 ? [itemData] : [],
                kitchen2: menu.kitchen === 2 ? [itemData] : [],
                k1Status: '완료',
                k2Status: '완료',
                paid: false,
                isManualOrder: true
            };

            try {
                await window.addDoc(window.collection(window.db, "orders"), manualOrder);
            } catch (e) {
                alert("주문 등록 실패: " + e.message);
            }
        }

        // 선택된 테이블 비우기 (결제 완료 시 매출 DB에 전송 후 삭제)
        async function clearSelectedTable() {
            if (!selectedTable) return;
            const orders = (window.currentOrders && window.currentOrders[selectedTable]) || [];
            if (orders.length === 0) {
                alert("선택된 테이블에 주문이 없습니다.");
                return;
            }

            if (!confirm(`${selectedTable}을(를) 결제 및 퇴장 처리하시겠습니까?`)) return;

            try {
                for (const ord of orders) {
                    // 매출 DB(sales)에 저장
                    const salesData = { ...ord, payTime: Date.now() };
                    delete salesData.id;
                    await window.addDoc(window.collection(window.db, "sales"), salesData);

                    // 주문 목록(orders)에서 삭제
                    await window.deleteDoc(window.doc(window.db, "orders", ord.id));
                }
            } catch (e) {
                alert("비우기 실패: " + e.message);
            }
        }

        /* --- 월간 매출표 기능 --- */
        function openSalesModal() {
            const now = new Date();
            const monthStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월`;
            document.getElementById('sales-title').innerText = `📊 ${monthStr} 매출 집계표`;

            const sales = window.salesHistory || [];
            let grandTotal = 0;
            let totalOrders = sales.length;
            const menuStats = {};

            sales.forEach(ord => {
                if (ord.items) {
                    ord.items.forEach(item => {
                        grandTotal += item.price;
                        if (!menuStats[item.name]) {
                            menuStats[item.name] = { qty: 0, price: 0 };
                        }
                        menuStats[item.name].qty += item.qty;
                        menuStats[item.name].price += item.price;
                    });
                }
            });

            document.getElementById('total-sales-amount').innerText = grandTotal.toLocaleString();
            document.getElementById('total-order-count').innerText = totalOrders.toLocaleString();

            const tbody = document.getElementById('sales-table-body');
            tbody.innerHTML = '';

            const keys = Object.keys(menuStats);
            if (keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">매출 내역이 없습니다.</td></tr>';
            } else {
                keys.forEach(menuName => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${menuName}</td>
                        <td>${menuStats[menuName].qty}개</td>
                        <td>${menuStats[menuName].price.toLocaleString()}원</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('sales-modal').style.display = 'flex';
        }

        function closeSalesModal() {
            document.getElementById('sales-modal').style.display = 'none';
        }

        /* --- 비밀번호 입력 매출표 초기화 기능 (비밀번호: 0146) --- */
        async function resetSalesData() {
            const pwd = prompt("매출표 초기화 비밀번호를 입력하세요:");
            if (pwd === null) return;

            if (pwd !== "0146") {
                alert("비밀번호가 올바르지 않습니다.");
                return;
            }

            if (!confirm("현재 매장 테이블 주문은 유지되고, 매출표 내역만 초기화됩니다. 진행하시겠습니까?")) return;

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "sales"));
                const promises = [];
                querySnapshot.forEach((documentSnap) => {
                    promises.push(window.deleteDoc(window.doc(window.db, "sales", documentSnap.id)));
                });
                await Promise.all(promises);
                alert("매출표 내역이 성공적으로 초기화되었습니다.");
            } catch (e) {
                alert("매출표 초기화 중 오류 발생: " + e.message);
            }
        }

        window.onload = function() {
            renderMenuButtons();
            window.renderTables();
        };
    </script>
</body>
</html>
