<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오셨드레요 메밀여행 - QR 주문</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f5f5f5; color: #333; padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1.store-title { text-align: center; color: #4a3b32; margin-bottom: 15px; font-size: 28px; font-weight: 800; word-break: keep-all; }
        .table-input { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; background: #fdf8f4; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        .table-input select { padding: 8px 12px; font-size: 16px; font-weight: bold; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; cursor: pointer; }
        
        .category-title { font-size: 18px; font-weight: bold; color: #4a3b32; margin: 20px 0 10px 0; padding-bottom: 5px; border-bottom: 2px solid #4a3b32; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .menu-item.soldout { opacity: 0.6; }
        .menu-name { font-weight: bold; font-size: 15px; }
        .soldout-tag { color: #e74c3c; font-weight: bold; font-size: 13px; margin-left: 5px; }
        .menu-price { color: #666; font-size: 14px; }
        .qty-btn { width: 32px; height: 32px; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .qty-btn:disabled { background: #eee; border-color: #ddd; color: #ccc; cursor: not-allowed; }
        .qty-num { margin: 0 10px; font-weight: bold; font-size: 16px; }
        
        .call-btn { width: 100%; padding: 12px; background: #7f8c8d; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .total-price { text-align: right; font-size: 20px; font-weight: bold; color: #d32f2f; margin-top: 15px; }
        .btn-submit { width: 100%; padding: 15px; background: #4a3b32; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .receipt { display: none; background: #fff8e7; border: 2px dashed #4a3b32; }
        .receipt-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    </style>

    <!-- Firebase SDK 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAceyCFUzGg5fz5pPWt9H6RgE3wrQe0ob4",
            authDomain: "memil-pos.firebaseapp.com",
            projectId: "memil-pos",
            storageBucket: "memil-pos.firebasestorage.app",
            messagingSenderId: "935304612479",
            appId: "1:935304612479:web:7da29c1b9d53bce4da8d4a",
            measurementId: "G-HT56JW59BN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;

        // 품절 상태 실시간 감지
        onSnapshot(doc(db, "settings", "soldout"), (docSnap) => {
            if (docSnap.exists()) {
                window.soldOutList = docSnap.data().items || [];
            } else {
                window.soldOutList = [];
            }
            if (window.renderMenu) window.renderMenu();
        });
    </script>
</head>
<body>

    <div class="card" id="order-form">
        <h1 class="store-title">🌾 오셨드레요 메밀여행</h1>
        
        <div class="table-input">
            <label for="table-select"><b>위치 선택:</b></label>
            <select id="table-select">
                <option value="">-- 위치 선택 --</option>
                <optgroup label="매장 내 테이블">
                    <option value="1번 테이블">1번 테이블</option>
                    <option value="2번 테이블">2번 테이블</option>
                    <option value="3번 테이블">3번 테이블</option>
                    <option value="4번 테이블">4번 테이블</option>
                    <option value="5번 테이블">5번 테이블</option>
                    <option value="6번 테이블">6번 테이블</option>
                    <option value="7번 테이블">7번 테이블</option>
                    <option value="8번 테이블">8번 테이블</option>
                </optgroup>
                <optgroup label="테라스 석">
                    <option value="테라스 1번">테라스 1번</option>
                    <option value="테라스 2번">테라스 2번</option>
                    <option value="테라스 3번">테라스 3번</option>
                    <option value="테라스 4번">테라스 4번</option>
                </optgroup>
            </select>
        </div>

        <button class="call-btn" onclick="callStaff()">🔔 직원 호출하기 (물/반찬/요청)</button>

        <div id="menu-list"></div>

        <div class="total-price">총 결제금액: <span id="total-amount">0</span>원</div>
        <button class="btn-submit" onclick="processOrder()">주문하기</button>
    </div>

    <div class="card receipt" id="receipt">
        <h1 style="margin-bottom:5px; text-align:center;">📋 주문 확인서</h1>
        <p style="text-align: center; color: #666; font-size: 13px; margin-bottom: 15px;">오셨드레요 메밀여행</p>
        
        <div class="receipt-line">
            <span><b>테이블 위치</b></span>
            <span id="rec-table" style="font-weight:bold; color:#d32f2f;"></span>
        </div>
        <div class="receipt-line">
            <span>주문 시각</span>
            <span id="rec-time"></span>
        </div>
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed #ccc;">
        
        <div id="rec-items"></div>
        
        <hr style="margin: 10px 0; border: none; border-top: 1px dashed #ccc;">
        <div class="receipt-line" style="font-size: 16px; font-weight: bold;">
            <span>총 결제금액</span>
            <span id="rec-total"></span>
        </div>
        
        <button class="btn-submit" onclick="location.reload()" style="background:#666; margin-top:20px;">추가 주문하기</button>
    </div>

    <script>
        const menuCategories = [
            {
                category: "🥞 전 / 부침류",
                items: [
                    { name: "메밀전모듬", price: 20000, kitchen: 1 },
                    { name: "메밀전", price: 7000, kitchen: 1 },
                    { name: "메밀전병", price: 7000, kitchen: 1 },
                    { name: "수수부꾸미(수수전병)", price: 7000, kitchen: 1 },
                    { name: "감자전", price: 10000, kitchen: 1 }
                ]
            },
            {
                category: "🍜 국수 / 식사류",
                items: [
                    { name: "메밀물막국수", price: 9000, kitchen: 2 },
                    { name: "메밀비빔막국수", price: 9000, kitchen: 2 },
                    { name: "메밀들기름막국수", price: 10000, kitchen: 2 },
                    { name: "메밀묵사발", price: 9000, kitchen: 2 },
                    { name: "감자옹심이", price: 10000, kitchen: 2 }
                ]
            },
            {
                category: "🍶 주류 / 음료 / 사리추가",
                items: [
                    { name: "소주 / 맥주", price: 5000, kitchen: 1 },
                    { name: "봉평메밀막걸리", price: 5000, kitchen: 1 },
                    { name: "음료수", price: 2000, kitchen: 1 },
                    { name: "사리추가", price: 3000, kitchen: 2 }
                ]
            }
        ];

        let flatMenus = [];
        menuCategories.forEach(cat => flatMenus.push(...cat.items));
        let quantities = new Array(flatMenus.length).fill(0);

        window.renderMenu = function() {
            const menuContainer = document.getElementById('menu-list');
            menuContainer.innerHTML = '';
            let globalIndex = 0;

            const currentSoldOuts = window.soldOutList || [];

            menuCategories.forEach(cat => {
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = cat.category;
                menuContainer.appendChild(catTitle);

                cat.items.forEach(menu => {
                    const idx = globalIndex;
                    const isSoldOut = currentSoldOuts.includes(menu.name);

                    if (isSoldOut) quantities[idx] = 0;

                    const item = document.createElement('div');
                    item.className = `menu-item ${isSoldOut ? 'soldout' : ''}`;
                    item.innerHTML = `
                        <div>
                            <div class="menu-name">
                                ${menu.name}
                                ${isSoldOut ? '<span class="soldout-tag">(재료가 소진되었습니다)</span>' : ''}
                            </div>
                            <div class="menu-price">${menu.price.toLocaleString()}원</div>
                        </div>
                        <div>
                            <button class="qty-btn" onclick="changeQty(${idx}, -1)" ${isSoldOut ? 'disabled' : ''}>-</button>
                            <span class="qty-num" id="qty-${idx}">${quantities[idx]}</span>
                            <button class="qty-btn" onclick="changeQty(${idx}, 1)" ${isSoldOut ? 'disabled' : ''}>+</button>
                        </div>
                    `;
                    menuContainer.appendChild(item);
                    globalIndex++;
                });
            });
            calculateTotal();
        };

        function changeQty(index, delta) {
            if (quantities[index] + delta >= 0) {
                quantities[index] += delta;
                document.getElementById(`qty-${index}`).innerText = quantities[index];
                calculateTotal();
            }
        }

        function calculateTotal() {
            let total = 0;
            quantities.forEach((qty, idx) => {
                total += qty * flatMenus[idx].price;
            });
            document.getElementById('total-amount').innerText = total.toLocaleString();
            return total;
        }

        async function callStaff() {
            const tableSelect = document.getElementById('table-select').value;
            if (!tableSelect) {
                alert("테이블 위치를 선택해주세요.");
                return;
            }
            if (!confirm(`${tableSelect}에서 직원을 호출하시겠습니까?`)) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

            const callOrder = {
                timestamp: Date.now(),
                table: tableSelect,
                time: timeStr,
                items: [{ name: "🔔 직원 호출 (물/반찬/요청)", qty: 1, price: 0 }],
                total: 0,
                kitchen1: [{ name: "🔔 직원 호출 (물/반찬/요청)", qty: 1 }],
                kitchen2: [],
                k1Status: '신규주문',
                k2Status: '완료',
                paid: true
            };

            try {
                await window.addDoc(window.collection(window.db, "orders"), callOrder);
                alert(`${tableSelect}에서 직원을 호출했습니다.`);
            } catch (e) {
                alert("호출 전송 실패: " + e.message);
            }
        }

        async function processOrder() {
            const tableSelect = document.getElementById('table-select').value;
            const total = calculateTotal();

            if (!tableSelect) {
                alert("테이블 위치를 선택해주세요.");
                return;
            }
            if (total === 0) {
                alert("메뉴를 하나 이상 선택해주세요.");
                return;
            }

            const isConfirmed = confirm(`선택하신 메뉴로 주문을 진행하시겠습니까?\n\n총 결제금액: ${total.toLocaleString()}원`);
            if (!isConfirmed) return;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

            const orderItems = [];
            const k1Items = [];
            const k2Items = [];

            quantities.forEach((qty, idx) => {
                if (qty > 0) {
                    const itemData = {
                        name: flatMenus[idx].name,
                        qty: qty,
                        price: flatMenus[idx].price * qty
                    };
                    orderItems.push(itemData);

                    if (flatMenus[idx].kitchen === 1) k1Items.push(itemData);
                    if (flatMenus[idx].kitchen === 2) k2Items.push(itemData);
                }
            });

            const newOrder = {
                timestamp: Date.now(),
                table: tableSelect,
                time: timeStr,
                items: orderItems,
                kitchen1: k1Items,
                kitchen2: k2Items,
                total: total,
                k1Status: k1Items.length > 0 ? '신규주문' : '완료',
                k2Status: k2Items.length > 0 ? '신규주문' : '완료',
                paid: false
            };

            try {
                await window.addDoc(window.collection(window.db, "orders"), newOrder);

                document.getElementById('rec-table').innerText = tableSelect;
                document.getElementById('rec-time').innerText = timeStr;
                
                const recItems = document.getElementById('rec-items');
                recItems.innerHTML = '';
                
                orderItems.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'receipt-line';
                    row.innerHTML = `
                        <span>${item.name} x ${item.qty}</span>
                        <span>${item.price.toLocaleString()}원</span>
                    `;
                    recItems.appendChild(row);
                });

                document.getElementById('rec-total').innerText = total.toLocaleString() + "원";
                
                document.getElementById('order-form').style.display = 'none';
                document.getElementById('receipt').style.display = 'block';
                
                alert("주문이 정상적으로 접수되었습니다!");
            } catch (e) {
                alert("주문 전송 중 오류가 발생했습니다: " + e.message);
            }
        }

        window.onload = function() {
            window.renderMenu();
        };
    </script>
</body>
</html>
